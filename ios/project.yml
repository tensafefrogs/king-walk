# XcodeGen spec for the iOS app. The Xcode project is generated from this file and not committed:
#   ios/scripts/prepare-web.sh && (cd ios && xcodegen generate)
name: KingWalk
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # The app's bundle ID. The widget's is this plus .widget.
    # The official build passes the BUNDLE_ID Actions variable (ios/scripts/upload.sh); this placeholder is for
    # simulator builds and copies that haven't set their own (README, "Your own copy").
    KW_BUNDLE_ID: com.example.kingwalk
targets:
  KingWalk:
    type: application
    platform: iOS
    sources:
      - path: KingWalk
        excludes:
          - web
      - path: Shared
      # The game itself, copied in by scripts/prepare-web.sh
      - path: KingWalk/web
        type: folder
        buildPhase: resources
    dependencies:
      - target: KingWalkWidget
    entitlements:
      path: KingWalk/KingWalk.entitlements
      properties:
        # iCloud key-value storage: the save follows the player between devices (SaveStore.swift)
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Game Center: leaderboards and achievements (GameCenter.swift)
        com.apple.developer.game-center: true
        # a keychain group shared with the widget, which shows the player's rank (Shared/Progress.swift, SharedStore)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KW_BUNDLE_ID).shared
    info:
      path: KingWalk/Info.plist
      properties:
        CFBundleDisplayName: King Walk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        # the languages the game has (lang.js and the .lproj folders): iOS gives the page the player's one of these
        CFBundleLocalizations: [en, es, fr, de, it, pt-BR, nl, ru, ja, ko, zh-Hans]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.board-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # landscape too: iPhone Duo's inner screen propped up like a laptop is landscape (the page has layouts for both)
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KW_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic

  KingWalkWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KingWalkWidget
      - path: Shared
    entitlements:
      path: KingWalkWidget/KingWalkWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KW_BUNDLE_ID).shared
    info:
      path: KingWalkWidget/Info.plist
      properties:
        CFBundleDisplayName: King Walk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        # the languages the game has (lang.js and the .lproj folders): iOS gives the page the player's one of these
        CFBundleLocalizations: [en, es, fr, de, it, pt-BR, nl, ru, ja, ko, zh-Hans]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KW_BUNDLE_ID).widget
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
