# XcodeGen spec for the iOS app. The Xcode project is generated from this file and not committed:
#   ios/scripts/prepare-web.sh && (cd ios && xcodegen generate)
name: KingWalk
options:
  bundleIdPrefix: com.geoffstearns
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  KingWalk:
    type: application
    platform: iOS
    sources:
      - path: KingWalk
        excludes:
          - web
      - path: Shared
      # The game itself, copied in by scripts/prepare-web.sh
      - path: KingWalk/web
        type: folder
        buildPhase: resources
    dependencies:
      - target: KingWalkWidget
    entitlements:
      path: KingWalk/KingWalk.entitlements
      properties:
        # iCloud key-value storage: the save follows the player between devices (SaveStore.swift)
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Game Center: leaderboards and achievements (GameCenter.swift)
        com.apple.developer.game-center: true
        # shared with the widget, which shows the player's rank (WidgetData.swift)
        com.apple.security.application-groups:
          - group.com.geoffstearns.kingwalk
    info:
      path: KingWalk/Info.plist
      properties:
        CFBundleDisplayName: King Walk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.board-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geoffstearns.kingwalk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic

  KingWalkWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KingWalkWidget
      - path: Shared
    entitlements:
      path: KingWalkWidget/KingWalkWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.geoffstearns.kingwalk
    info:
      path: KingWalkWidget/Info.plist
      properties:
        CFBundleDisplayName: King Walk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geoffstearns.kingwalk.widget
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
