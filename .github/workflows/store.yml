# Uploads the App Store listing (ios/store/listing.json), screenshots, creative assets and the Game Center setup
# (ios/store/gamecenter.json) to App Store Connect whenever they change on main, so the store matches the repo.
# Runs on Linux (cheap). Uses the same secrets as the iOS app build.
# Only the version being prepared can change; when there isn't one, the version part is skipped.
name: App Store listing

on:
  push:
    branches: [main]
    paths: ['ios/store/listing.json', 'ios/store/l10n/*', 'ios/store/screenshots/*.png', 'ios/store/screenshots.js', 'ios/store/upload_listing.py', 'ios/store/creative.py',
            'ios/store/header/*', 'ios/store/previews/*', 'ios/store/gamecenter.json', 'ios/store/gamecenter/*', 'ios/store/gamecenter.py',
            '.github/workflows/store.yml']
  workflow_dispatch:
    inputs:
      discover:
        description: Only print what the Asset Library API accepts (creative.py --discover)
        type: boolean
        default: false

jobs:
  upload:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.secrets.outputs.ok }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        id: secrets
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$BUNDLE_ID" ]; then echo "::notice::App Store Connect secrets or the BUNDLE_ID variable aren't set yet (ios/README.md, One-time setup); nothing uploaded."; echo ok=false >> "$GITHUB_OUTPUT"; else echo ok=true >> "$GITHUB_OUTPUT"; fi
      - run: pip install pyjwt cryptography
        if: steps.secrets.outputs.ok == 'true'
      - name: Upload listing and screenshots
        if: steps.secrets.outputs.ok == 'true' && !inputs.discover
        run: python3 ios/store/upload_listing.py
      - name: Game Center leaderboards and achievements
        if: steps.secrets.outputs.ok == 'true' && !inputs.discover
        continue-on-error: true   # a newer part of the API: a failure is reported without stopping the rest
        run: python3 ios/store/gamecenter.py
      - name: Creative assets (header, search results, app previews)
        # a new API (App Store Connect API 4.5): a failure here is reported but doesn't fail the listing
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: python3 ios/store/creative.py ${{ inputs.discover && '--discover' || '' }}

  # The screenshots in each other language: the game in that language with translated captions (l10n/<locale>.json),
  # made here rather than kept in the repo, then uploaded to that language's page. One job per language, side by side.
  # Each job keeps its images as a workflow artifact for 30 days, to look at.
  screenshots:
    needs: upload
    if: needs.upload.outputs.ok == 'true' && !inputs.discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [de-DE, es-ES, es-MX, fr-FR, it, ja, ko, nl-NL, pt-BR, ru, zh-Hans]
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright, and fonts for Japanese, Korean and Chinese
        run: |
          npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Make the screenshots
        run: node ios/store/screenshots.js --lang ${{ matrix.locale }}
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.locale }}
          path: ios/store/screenshots/l10n/${{ matrix.locale }}/*.png
          retention-days: 30
      - run: pip install pyjwt cryptography
      - name: Upload them
        run: python3 ios/store/upload_listing.py --locale ${{ matrix.locale }}
