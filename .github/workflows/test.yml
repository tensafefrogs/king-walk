# On every push and pull request: plays puzzles in a browser (on the web and in a simulated iOS app), then checks
# the game's rules one by one (rating, saves, streaks, awards, translations).
name: Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node testing/smoke.js
      - run: node testing/unit.js
