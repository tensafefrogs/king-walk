# On every push and pull request: plays puzzles in a browser (on the web and in simulated iOS and Android apps), then checks
# the game's rules one by one (rating, saves, streaks, awards, translations), after checking the website and both apps
# are in step (testing/parity.js).
name: Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node testing/parity.js          # the website, the iOS app and the Android app in step (fast: first)
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node testing/smoke.js
      - run: node testing/unit.js

  # the layout check (testing/layout.js) on the sizes that broke before, in English and German (long words), beside the
  # tests: each size runs as its own process at the same time, so it takes about as long as the slowest one
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Layout on the sizes that break first
        run: |
          pids=()
          for size in phone-320 phone-375-land ipad-slideover duo-book text-ax5 app-ipad-10-land; do
            LAYOUT_OUT=testing/out/$size node testing/layout.js en-US,de-DE $size > testing/out-$size.txt 2>&1 & pids+=($!)
          done
          fail=0; for p in "${pids[@]}"; do wait $p || fail=1; done
          for f in testing/out-*.txt; do echo "== $f"; cat "$f"; done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: layout-problems, path: testing/out/}

  # the daily puzzle through random sequences of play across days, on a fake clock (testing/daily-model.js): about 40 s
  daily-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node testing/daily-model.js

  # the app's save rule (ios/KingWalk/SaveRank.swift) against the same cases as the page's (testing/save-cases.json),
  # then a copy with one comparison flipped, which the cases must catch: about 1 minute
  save-rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: SaveRank against the shared cases
        run: swiftc ios/KingWalk/SaveRank.swift testing/SaveRankCases.swift -o /tmp/save-rank && /tmp/save-rank testing/save-cases.json
      - name: The cases catch a SaveRank that drifts (progress compared the wrong way)
        run: |
          sed 's/return A.progress > B.progress/return A.progress < B.progress/' ios/KingWalk/SaveRank.swift > /tmp/SaveRankMutant.swift
          ! cmp -s ios/KingWalk/SaveRank.swift /tmp/SaveRankMutant.swift || { echo "the mutation didn't apply: update this step"; exit 1; }
          swiftc /tmp/SaveRankMutant.swift testing/SaveRankCases.swift -o /tmp/save-rank-mutant
          if /tmp/save-rank-mutant testing/save-cases.json; then echo "the cases didn't notice SaveRank changing"; exit 1; fi
