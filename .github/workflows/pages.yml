# Publishes the website to GitHub Pages from main, with config.js written from this repository's Actions variables
# (all optional): GOATCOUNTER_URL (the stats; none are sent without it), SITE_URL and APP_STORE_ID. So the owner's
# accounts aren't in the code, and a copy of the repo sends nothing anywhere until its owner sets their own.
# Needs Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:          # rebuilds pick up the App Store listing once Apple's lookup has the app (the website's App Store line)
    - cron: '41 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The videos (the media branch, as media.json names them)
        run: python3 scripts/media.py fetch
      - name: Where the app stands in App Store Connect (the status branch; the site's App Store line reads it)
        run: python3 scripts/status.py fetch
      - name: Assemble the site
        env:
          GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          APP_STORE_ID: ${{ vars.APP_STORE_ID }}
          ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          pip install --quiet segno==1.6.1          # draws the App Store link's QR code (app-qr.svg) for computers
          mkdir _site
          # the game, its pages, the brand and press kit, and the store images the press kit links to
          cp -R index.html favicon.ico chess.js cta.js lang config.js sw.js manifest.webmanifest og.png privacy.html terms.html support.html 404.html .nojekyll p fonts icons brand press _site/
          mkdir -p _site/ios/store _site/ios/KingWalk/Assets.xcassets
          cp -R ios/store/screenshots ios/store/header _site/ios/store/ && rm -rf _site/ios/store/screenshots/raw
          cp -R ios/KingWalk/Assets.xcassets/AppIcon.appiconset _site/ios/KingWalk/Assets.xcassets/
          # the service worker serves fonts and icons from its cache first: name the cache after their contents, so
          # changing any of them makes returning players fetch the new ones (puzzle chunks carry their own hash, ?v=)
          files=$(cd _site && find fonts icons -type f | sort)
          hash=$(cd _site && cat $files | sha256sum | cut -c1-10)
          sed -i "s/const CACHE = \"king-walk-[^\"]*\"/const CACHE = \"king-walk-$hash\"/" _site/sw.js
          grep -q "king-walk-$hash" _site/sw.js && echo "service worker cache: king-walk-$hash"
          python3 - <<'PY'
          import json, os, re
          cfg = {'goatcounter': os.environ.get('GOATCOUNTER_URL', '').strip(), 'site': os.environ.get('SITE_URL', '').strip(),
                 'appStoreId': os.environ.get('APP_STORE_ID', '').strip(), 'appLive': False}
          # is the app on sale yet? Apple's public lookup says (the website then shows its App Store line)
          if cfg['appStoreId']:
              import urllib.request
              try:
                  r = json.load(urllib.request.urlopen('https://itunes.apple.com/lookup?id=' + cfg['appStoreId'], timeout=20))
                  cfg['appLive'] = r.get('resultCount', 0) > 0
                  print('App Store lookup: ' + str(r.get('resultCount', 0)) + ' result(s)')
              except Exception as e:
                  print('App Store lookup failed:', e)
          # Apple's public lookup can lag a day behind a release: App Store Connect's own state, which the App Store
          # release workflow writes to ios/store/status.md, counts too
          if not cfg['appLive'] and os.path.exists('ios/store/status.md'):
              cfg['appLive'] = bool(re.search(r'\| (READY_FOR_DISTRIBUTION|READY_FOR_SALE) \|', open('ios/store/status.md').read()))
              print('App Store Connect status: ' + ('on sale' if cfg['appLive'] else 'not on sale yet'))
          # the Android app on Google Play: its package name, and whether its page is public yet (the website then points
          # Android browsers there, as it does iPhones to the App Store). The store page answers 404 until it's released.
          cfg['playId'] = os.environ.get('ANDROID_APPLICATION_ID', '').strip(); cfg['playLive'] = False
          if cfg['playId']:
              import urllib.request, urllib.error
              try:
                  req = urllib.request.Request('https://play.google.com/store/apps/details?id=' + cfg['playId'] + '&hl=en', headers={'User-Agent': 'Mozilla/5.0'})
                  cfg['playLive'] = urllib.request.urlopen(req, timeout=20).status == 200
              except urllib.error.HTTPError as e:
                  print('Google Play: not public yet (' + str(e.code) + ')')
              except Exception as e:
                  print('Google Play lookup failed:', e)
              print('Google Play: ' + ('live' if cfg['playLive'] else 'not live yet'))
          # a QR code of the App Store link, at the end of the page on computers: scanned with an iPhone, it opens the app's page
          if cfg['appStoreId'] and cfg['appLive']:
              try:
                  import segno
                  segno.make('https://apps.apple.com/app/id' + cfg['appStoreId'], error='m').save('_site/app-qr.svg', border=2, dark='#000', light=None, omitsize=True)
                  cfg['qr'] = 'app-qr.svg'
                  print('App Store QR code: app-qr.svg')
              except Exception as e:
                  print('App Store QR code failed:', e)
          # the Android app's App Links: the site says which app may open its links (the package name and the SHA-256
          # fingerprint of Google Play's signing key, Play Console → Test and release → App integrity), android/README.md
          pkg, certs = os.environ.get('ANDROID_APPLICATION_ID', '').strip(), [c.strip() for c in os.environ.get('ANDROID_CERT_SHA256', '').split(',') if c.strip()]
          if pkg and certs:
              os.makedirs('_site/.well-known', exist_ok=True)
              json.dump([{'relation': ['delegate_permission/common.handle_all_urls'], 'target': {'namespace': 'android_app', 'package_name': pkg, 'sha256_cert_fingerprints': certs}}], open('_site/.well-known/assetlinks.json', 'w'), indent=2)
              print('assetlinks.json: written')
          open('_site/config.js', 'w').write('/* written by .github/workflows/pages.yml */\nwindow.KING_WALK_CONFIG = ' + json.dumps(cfg) + ';\n')
          print('config.js:', ', '.join(f"{k}={'set' if v else 'empty'}" for k, v in cfg.items()))
          # link previews need absolute addresses: the site's, when it's set
          # Safari's Smart App Banner on iPhone and iPad, once the App Store ID is set (Safari shows it only while the
          # app is on sale, so it can go in before launch)
          # the press kit's App Store link (press/index.html has a placeholder, so the ID stays out of the code)
          press = open('_site/press/index.html').read()
          store = 'https://apps.apple.com/app/id' + cfg['appStoreId'] if cfg['appStoreId'] else ''
          press = press.replace('href="#app-store"', f'href="{store}"') if store else re.sub(r'\s*<dt>App Store</dt><dd>.*?</dd>', '', press)
          open('_site/press/index.html', 'w').write(press)
          if cfg['appStoreId']:
              html = open('_site/index.html').read()
              html = html.replace('<meta name="description"', f'<meta name="apple-itunes-app" content="app-id={cfg["appStoreId"]}">\n<meta name="description"', 1)
              open('_site/index.html', 'w').write(html)
              print('Smart App Banner: on')
          site = cfg['site'].rstrip('/') + '/' if cfg['site'] else ''
          if site:
              html = open('_site/index.html').read()
              html = html.replace('<meta property="og:url" content="./">', f'<meta property="og:url" content="{site}">')
              html = html.replace('content="og.png"', f'content="{site}og.png"')
              open('_site/index.html', 'w').write(html)
              print('link previews point at', site)
              # structured data: what King Walk is, for search engines' rich results
              ld = {'@context': 'https://schema.org', '@type': 'VideoGame', 'name': 'King Walk', 'url': site, 'image': site + 'og.png',
                    'description': 'Chess puzzles that fight back. 53,000 puzzles from real games, a new daily puzzle every day, and a rating that finds your level.',
                    'genre': ['Puzzle', 'Chess'], 'gamePlatform': ['Web browser', 'iOS'], 'applicationCategory': 'Game', 'operatingSystem': 'Any',
                    'inLanguage': ['en', 'es', 'fr', 'de', 'it', 'pt-BR', 'pt-PT', 'nl', 'ru', 'ja', 'ko', 'zh-Hans', 'zh-Hant', 'ar', 'he', 'hi', 'mr', 'ur', 'bn', 'gu', 'pa', 'ta', 'te', 'kn', 'ml', 'or', 'th', 'tr', 'id', 'ms', 'vi', 'pl', 'cs', 'sk', 'sl', 'hr', 'uk', 'el', 'ro', 'hu', 'ca', 'sv', 'da', 'nb', 'fi'], 'isAccessibleForFree': True,
                    'offers': {'@type': 'Offer', 'price': '0', 'priceCurrency': 'USD'}}
              html = open('_site/index.html').read()
              html = html.replace('</head>', '<script type="application/ld+json">' + json.dumps(ld) + '</script>\n</head>', 1)
              open('_site/index.html', 'w').write(html)
              print('structured data: added')
              # a sitemap for search engines, and a robots.txt pointing to it (robots.txt only counts at a domain's root)
              pages = ['', 'press/', 'support.html', 'privacy.html', 'terms.html']
              open('_site/sitemap.xml', 'w').write('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
                  + ''.join(f'  <url><loc>{site}{p}</loc></url>\n' for p in pages) + '</urlset>\n')
              print('sitemap.xml:', len(pages), 'pages')
              from urllib.parse import urlparse
              if urlparse(site).path in ('', '/'):
                  open('_site/robots.txt', 'w').write(f'User-agent: *\nAllow: /\n\nSitemap: {site}sitemap.xml\n')
                  print('robots.txt: written')
          PY
          # the page in each language (kingwalk.app/de/…), with hreflang links and sitemap entries (scripts/langpages.py)
          python3 scripts/langpages.py _site "$SITE_URL"
          du -sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # .well-known/assetlinks.json (the Android app's links) and .nojekyll start with a dot, and this action leaves
          # such files out unless asked: both were missing from the live site until November 2026 (testing/parity.js)
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
