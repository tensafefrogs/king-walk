# Builds the Android app on a GitHub Linux runner, then plays it on an Android emulator (android/testing/device.js).
# - On pushes to main that change the app or the game: a debug build, lint, and the emulator check. No secrets.
# - Run it by hand (Actions → Android app → Run workflow) with "release" ticked to build the signed bundle (.aab) for
#   Google Play, and upload it to Play if android/release.json says so. Needs the secrets and variables in android/README.md.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', 'chess.js', 'lang/**', '.github/workflows/android.yml', '!android/store/**', '!android/README.md']
  workflow_dispatch:
    inputs:
      release:
        description: Build the signed bundle for Google Play (and upload it, as android/release.json says)
        type: boolean
        default: false
      playgames:
        description: Make the Play Games achievements and leaderboards (android/store/playgames.py) and print the id map
        type: boolean
        default: false

defaults:
  run:
    shell: bash

env:
  ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
  GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
  SITE_URL: ${{ vars.SITE_URL }}
  ANDROID_PLAY_GAMES_APP_ID: ${{ vars.ANDROID_PLAY_GAMES_APP_ID }}
  ANDROID_PLAY_GAMES_IDS: ${{ vars.ANDROID_PLAY_GAMES_IDS }}

jobs:
  # Whether to build and release: by hand with "release" ticked, or a push to main that changes android/release.json.
  # Worked out from the push's before and after, not the push's list of commits: commits pushed to main after their branch's
  # Test run (the repo's rule) are already known to GitHub, so the push lists none and the release never ran (ec60285).
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.release }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then release=$([ "$ASKED" = true ] && echo true || echo false)
          else
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            else changed=$(git diff --name-only HEAD~1 HEAD); fi          # a new branch, or history rewritten: the last commit
            release=$(echo "$changed" | grep -qx 'android/release.json' && echo true || echo false)
          fi
          echo "release=$release" | tee -a "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v5
      - name: Copy the game into the app
        run: android/scripts/prepare-web.sh
      - name: Debug build, lint and unit tests
        working-directory: android
        # the unit tests (app/src/test) check the widgets' rules and draw them, as PNGs in app/build/widgets/
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-debug.html
            android/app/build/widgets/
          if-no-files-found: ignore

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write          # the screenshots branch, below
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with: {name: android-debug, path: apk}
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Playwright (its Android support needs no browser)
        run: npm install --no-save playwright@1.63.0
      - name: Let the emulator use the processor's virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Play the app on an emulator (Android 13)
        id: first
        continue-on-error: true          # the next step tries again on a fresh emulator; a fault in the app fails both
        timeout-minutes: 15          # up to 12 minutes for the test, and the emulator's start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 13 (per-app languages need 13 or later), the image most often run on GitHub's machines. Android 15,
          # 14 and Google's test image (ATD) each crashed or hung at random points here, the emulator itself (its own
          # shell segfaulting), not the app.
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 2          # the machine has 4: the rest are for adb and the test
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node android/testing/device.js "$(find apk -name app-debug.apk | head -1)" android-shots
      # The emulator here sometimes falls over by itself (its own shell segfaulting, the page dropped), and once it has, a
      # second try on it fails too (47ce8c9). So the second try starts a new emulator; a real fault in the app fails both.
      - name: Once more, on a fresh emulator
        if: steps.first.outcome == 'failure'
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 13 (per-app languages need 13 or later), the image most often run on GitHub's machines. Android 15,
          # 14 and Google's test image (ATD) each crashed or hung at random points here, the emulator itself (its own
          # shell segfaulting), not the app.
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 2          # the machine has 4: the rest are for adb and the test
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node android/testing/device.js "$(find apk -name app-debug.apk | head -1)" android-shots
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-screenshots
          path: android-shots
          if-no-files-found: ignore
      # the same screenshots on the branch android-screenshots (replaced each run, one commit), so they can be fetched
      # with git and looked at without downloading the artifact
      - name: Screenshots to the android-screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          [ -n "$(ls -A android-shots 2>/dev/null)" ] || exit 0          # none taken (the test stopped early)
          cd android-shots
          git init -q -b android-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Android emulator screenshots for ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:android-screenshots

  # by hand with "release" ticked, or (as the iOS app's release.json does) a push to main that changes
  # android/release.json once the upload key is set; Google Play production still needs "track": "production"
  release:
    if: needs.plan.outputs.release == 'true'
    needs: [plan, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v5
      - name: Version and build number
        run: |
          echo "VERSION_NAME=$(python3 -c 'import json; print(json.load(open("android/release.json"))["version"])')" >> "$GITHUB_ENV"
          # minutes since 1970: always higher than the last upload's, and far below Google Play's limit (2,100,000,000)
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: The upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::notice::android/release.json changed, but there's no upload key yet (android/README.md, Setting up): nothing to build"
            echo "NO_KEY=1" >> "$GITHUB_ENV"; exit 0
          fi
          [ -n "$KEYSTORE" ] || { echo "::error::The ANDROID_UPLOAD_KEYSTORE secret isn't set (android/README.md, Setting up)"; exit 1; }
          [ -n "$ANDROID_APPLICATION_ID" ] || { echo "::error::The ANDROID_APPLICATION_ID variable isn't set (android/README.md, Setting up)"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Copy the game into the app
        if: env.NO_KEY != '1'
        run: android/scripts/prepare-web.sh
      - name: Signed bundle
        if: env.NO_KEY != '1'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease && echo "Built $VERSION_NAME ($VERSION_CODE)"
      - uses: actions/upload-artifact@v6
        if: env.NO_KEY != '1'
        with:
          name: king-walk-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload to Google Play
        if: env.NO_KEY != '1'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth==2.40.3 requests==2.32.5
          python3 android/store/play.py android/app/build/outputs/bundle/release/app-release.aab

  playgames:
    if: github.event_name == 'workflow_dispatch' && inputs.playgames
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet google-auth==2.40.3 requests==2.32.5 pillow==11.3.0
      - name: Achievements and leaderboards
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 android/store/playgames.py apply
      - name: Images Google didn't take (512 x 512, named for their item), to add in Play Console
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playgames-images
          path: playgames-images/
          if-no-files-found: ignore
