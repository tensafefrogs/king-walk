<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<title>King Walk: page not found</title>
<style>
:root{--bg:#edf1ef;--card:#fff;--ink:#16302c;--muted:#56645f;--accent:#1c7868;--line:#d5ddd9}
@media (prefers-color-scheme:dark){:root{--bg:#111817;--card:#1a2321;--ink:#e9efec;--muted:#9fb0aa;--accent:#56c2ad;--line:#2c3936}}
@font-face{font-family:Fredoka;font-weight:600;src:url(/fonts/fredoka-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:400;src:url(/fonts/nunito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:700;src:url(/fonts/nunito-latin-700-normal.woff2) format("woff2")}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,-apple-system,sans-serif;padding:24px 16px;box-sizing:border-box}
main{max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;text-align:center}
img{width:72px;height:72px}
h1{font:600 26px/1.2 Fredoka,system-ui,sans-serif;margin:14px 0 6px}
p{margin:0 0 18px;color:var(--muted)}
a.btn{display:inline-block;background:var(--accent);color:#fff;font:600 17px Fredoka,system-ui,sans-serif;text-decoration:none;padding:12px 22px;border-radius:14px}
@media (prefers-color-scheme:dark){a.btn{color:#0d1f1c}}
</style></head><body>
<main>
  <img src="/brand/mark.svg" alt="">
  <h1>That square is empty</h1>
  <p>There's no page here. The puzzles are this way.</p>
  <a class="btn" href="/">Play King Walk</a>
</main>
</body></html>
